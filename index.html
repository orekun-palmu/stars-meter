<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スターメーター ランク別分析</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0f;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#180407,#111);padding:22px 16px;border-bottom:1px solid #4b151c;position:sticky;top:0;z-index:10}
h1{font-size:21px;margin:0 0 5px;font-weight:800}
.sub{color:#aaa;font-size:12px}
main{max-width:1100px;margin:auto;padding:16px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
select,input{width:100%;background:#19191d;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:#17171b;border:1px solid #2d2d32;border-radius:14px;padding:15px}
.label{font-size:11px;color:#999;margin-bottom:7px}
.value{font-size:23px;font-weight:800}
.value.small{font-size:17px}
.red{color:#ff5a70}
.green{color:#7fd97f}
.section{background:#151519;border:1px solid #29292e;border-radius:15px;margin:12px 0;overflow:hidden}
.section h2{font-size:15px;margin:0;padding:13px 15px;border-bottom:1px solid #29292e}
.content{padding:14px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.daybox{background:#1b1b20;border-radius:9px;padding:9px 5px;text-align:center;border:1px solid #303036}
.daybox.high{border-color:#ff9f43;background:#2a2118}
.daybox.danger{border-color:#ff4d5f;background:#32171b}
.daybox.empty{opacity:.35}
.dayname{font-size:11px;color:#aaa}.num{font-size:15px;font-weight:700;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 7px;border-bottom:1px solid #29292e;text-align:center}
th{color:#aaa;font-weight:600}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}
.safe{background:#263126;color:#9ee39e}.warn{background:#453718;color:#ffd36a}.dangerbadge{background:#481b21;color:#ff8793}
.note{font-size:12px;color:#aaa;line-height:1.7}
.today{background:linear-gradient(135deg,#211116,#17171b);border:1px solid #5b222b}
.big{font-size:28px;font-weight:900}
.barrow{display:grid;grid-template-columns:48px 1fr 70px;gap:8px;align-items:center;margin:8px 0;font-size:12px}
.bar{height:10px;background:#29292e;border-radius:99px;overflow:hidden}
.fill{height:100%;background:#c73b4d;border-radius:99px}
.miniinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.miniinfo div{background:#1b1b20;border-radius:9px;padding:8px 10px;font-size:12px;color:#ccc;border:1px solid #303036}
.miniinfo b{color:#fff}
@media(max-width:700px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr}
 .grid7{grid-template-columns:repeat(4,1fr)}
 main{padding:10px}
}

.gate{position:fixed;inset:0;background:#0d0d0f;display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.gate-box{background:#151519;border:1px solid #29292e;border-radius:16px;padding:28px 24px;max-width:340px;width:100%;text-align:center}
.gate-box h2{font-size:16px;margin:0 0 6px;color:#fff}
.gate-box p{font-size:12px;color:#999;margin:0 0 18px}
.gate-box input{width:100%;background:#19191d;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;font-size:15px;margin-bottom:12px}
.gate-box button{width:100%;background:#c73b4d;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.gate-box button:disabled{opacity:.5;cursor:default}
.gate-err{color:#ff8793;font-size:12px;margin-top:10px;min-height:16px}
#app{display:none}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2>🔒 パスワードが必要です</h2>
    <p>このページを見るにはパスワードを入力してください。</p>
    <input type="password" id="pwInput" placeholder="パスワード" autocomplete="off">
    <button id="pwBtn">開く</button>
    <div class="gate-err" id="pwErr"></div>
  </div>
</div>
<div id="app">

<header><h1>★ スターメーター ランク別分析</h1><div class="sub">データ期間：2026年2月16日〜8月24日（総合平均・月平均・曜日・日別傾向から「上がりやすい日」を確認）</div></header>
<main>
<div class="controls">
<select id="rank"></select>
<select id="month"><option value="all">全期間</option></select>
</div>

<div class="cards">
<div class="card"><div class="label">総合平均値</div><div class="value red" id="overall">-</div></div>
<div class="card"><div class="label">データ数</div><div class="value" id="count">-</div></div>
<div class="card"><div class="label">最高値</div><div class="value small" id="maxVal">-</div></div>
<div class="card"><div class="label">最低値</div><div class="value small green" id="minVal">-</div></div>
</div>

<div class="section today">
<h2>📅 日別傾向チェック（今日の日付基準）</h2>
<div class="content" id="today"></div>
</div>

<div class="section">
<h2>⚠️ 上がりやすい曜日</h2>
<div class="content" id="weekday"></div>
</div>

<div class="section">
<h2>📆 月平均</h2>
<div class="content" id="monthStats"></div>
</div>

<div class="section">
<h2>🚨 日別注意カレンダー</h2>
<div class="content">
<div class="note">基準：総合平均より <b>10%以上高い日＝注意</b>、<b>20%以上＝高注意</b>（データが無い日は「-」で表示）</div>
<div class="grid7" id="days" style="margin-top:12px"></div>
</div>
</div>

<div class="section">
<h2>📊 ランク比較</h2>
<div class="content" id="rankCompare"></div>
</div>
</main>

</div>

function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return buf;
}

async function deriveKey(password, saltB64, iterations){
  const enc = new TextEncoder();
  const salt = b64ToBuf(saltB64);
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

let DATA;

async function tryUnlock(password){
  const btn = document.getElementById('pwBtn');
  const err = document.getElementById('pwErr');
  btn.disabled = true;
  err.textContent = '';
  try {
    const key = await deriveKey(password, ENC.salt, ENC.iterations);
    const iv = b64ToBuf(ENC.iv);
    const data = b64ToBuf(ENC.data);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    const json = new TextDecoder().decode(plainBuf);
    DATA = JSON.parse(json);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
    initApp();
  } catch (e) {
    err.textContent = 'パスワードが違います。';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('pwBtn').addEventListener('click', () => {
  const v = document.getElementById('pwInput').value;
  if (v) tryUnlock(v);
});
document.getElementById('pwInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('pwBtn').click();
});

function initApp(){


const $ = id => document.getElementById(id);
const fmt = v => v == null ? "-" : Math.round(v).toLocaleString("ja-JP");
const pct = (v,b) => b ? Math.round((v/b-1)*100) : 0;
const rankLabel = r => r.replace(/(\d)$/,"+$1");

DATA.ranks.forEach(r=>{ $("rank").insertAdjacentHTML("beforeend",`<option value="${r}">${rankLabel(r)}</option>`); });
DATA.months.forEach(m=>{ $("month").insertAdjacentHTML("beforeend",`<option value="${m}">${m}</option>`); });

function render(){
 const rk=$("rank").value, mo=$("month").value;
 const ov=DATA.overall[rk];
 const base=ov.overall;
 const wk=DATA.weekday[rk];
 const mn=DATA.month[rk];
 const dy=DATA.day[rk];

 $("overall").textContent=fmt(base);
 $("count").textContent=ov.count.toLocaleString()+"件";
 $("maxVal").textContent=fmt(ov.max);
 $("minVal").textContent=fmt(ov.min);

 // 日別傾向チェック（今日の「日付」に対応する統計上の平均を表示。データ期間は2/16〜8/24）
 const now=new Date();
 const todayDay=String(now.getDate());
 const todayVal=dy[todayDay];
 const todayPct=todayVal&&base?pct(todayVal,base):null;
 let level="データ不足", cls="safe", msg="この日のデータが少ないため判断できません。";
 if(todayVal!=null){
   if(todayPct>=20){level="🔥 高注意";cls="dangerbadge";msg="過去平均よりかなり高い傾向。";}
   else if(todayPct>=10){level="⚠️ 注意";cls="warn";msg="過去平均より高めの傾向。";}
   else {level="○ 通常";cls="safe";msg="過去平均と比べて大きな上振れはありません。";}
 }
 $("today").innerHTML=`<div><span class="badge ${cls}">${level}</span></div>
 <div class="big" style="margin-top:8px">${todayVal!=null?fmt(todayVal):"-"}</div>
 <div class="note">${now.getDate()}日（毎月${now.getDate()}日）・このランクの日別平均（2〜8月のデータより算出）<br>${msg}${todayPct!=null?"（総合平均比 "+(todayPct>=0?"+":"")+todayPct+"%）":""}</div>
 <div class="miniinfo">
   <div>最高曜日：<b>${ov.bestWeekday}曜日</b>（${fmt(ov.bestWeekdayVal)}）</div>
   <div>最高日：<b>${ov.bestDay}</b>（${fmt(ov.bestDayVal)}）</div>
 </div>`;

 // 曜日
 const w=DATA.weekdays.map(k=>[k,wk[k]]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
 const maxW=w.length?w[0][1]:1;
 $("weekday").innerHTML=w.map(([k,v])=>{
   const p=Math.round(v/maxW*100);
   const diff=pct(v,base);
   const badge=diff>=20?`<span class="badge dangerbadge">高注意</span>`:diff>=10?`<span class="badge warn">注意</span>`:"";
   return `<div class="barrow"><b>${k}</b><div class="bar"><div class="fill" style="width:${p}%"></div></div><span>${fmt(v)} ${badge}</span></div>`;
 }).join("");

 // 月平均
 let mm=DATA.months.map(m=>[m,mn[m]]).filter(x=>x[1]!=null);
 if(mo!=="all") mm=mm.filter(x=>x[0]===mo);
 $("monthStats").innerHTML=mm.length?`<table><tr><th>月</th><th>平均値</th><th>総合平均比</th><th>判定</th></tr>`+
 mm.map(([m,v])=>{let diff=pct(v,base);let b=diff>=20?"高注意":diff>=10?"注意":"通常";let c=diff>=20?"dangerbadge":diff>=10?"warn":"safe";return `<tr><td>${m}</td><td>${fmt(v)}</td><td>${diff>=0?"+":""}${diff}%</td><td><span class="badge ${c}">${b}</span></td></tr>`}).join("")+"</table>":"<div class='note'>該当データなし</div>";

 // 日別
 $("days").innerHTML=Array.from({length:31},(_,i)=>{
   const day=String(i+1), v=dy[day];
   if(v==null)return `<div class="daybox empty"><div class="dayname">${i+1}日</div><div class="num">-</div></div>`;
   const diff=pct(v,base);
   const cl=diff>=20?"danger":diff>=10?"high":"";
   return `<div class="daybox ${cl}"><div class="dayname">${i+1}日</div><div class="num">${fmt(v)}</div>${diff>=20?"<div>🔥</div>":diff>=10?"<div>⚠️</div>":""}</div>`;
 }).join("");

 // 全ランク比較
 const compare=DATA.ranks.map(r=>({r,v:DATA.overall[r].overall})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
 const max=compare[0]?.v||1;
 $("rankCompare").innerHTML=compare.map(x=>`<div class="barrow"><b>${rankLabel(x.r)}</b><div class="bar"><div class="fill" style="width:${Math.max(3,x.v/max*100)}%"></div></div><span>${fmt(x.v)}</span></div>`).join("");
}

$("rank").addEventListener("change",render);
$("month").addEventListener("change",render);
$("rank").value="A1";
render();

}
</script>
</body>
</html>
